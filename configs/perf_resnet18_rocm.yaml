experiment:
  name: perf_resnet18_rocm
  seed: 42
  deterministic: false

model:
  architecture: resnet18
  pretrained: true
  training_mode: full_finetuning

data:
  train_dir: data/train
  val_dir: data/val
  test_dir: data/test
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  grayscale_to_rgb: true
  max_train_samples_per_class: 1000
  max_val_samples_per_class: 200

training:
  epochs: 3
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.00001
  scheduler: ReduceLROnPlateau
  mixed_precision:
    enabled: false
    dtype: float16
    grad_scaler: true
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 3

outputs:
  run_dir: runs/perf_resnet18_rocm
  checkpoint_dir: checkpoints/perf_resnet18_rocm
