experiment:
  name: tuning_resnet18
  seed: 42
  deterministic: false

model:
  architecture: resnet18
  pretrained: true
  training_mode: classifier_only

data:
  train_dir: data/train
  val_dir: data/val
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  grayscale_to_rgb: true
  max_train_samples_per_class: 1000
  max_val_samples_per_class: 200

tuning:
  learning_rate:
    - 0.001
    - 0.0003
    - 0.0001
  weight_decay:
    - 0.0001
    - 0.00001
  optimizer: AdamW
  scheduler: ReduceLROnPlateau
  mixed_precision:
    enabled: false
    dtype: float16
    grad_scaler: true
  stages:
    - name: classifier_only
      training_mode: classifier_only
      epochs: 3
      learning_rate_multiplier: 1.0
    - name: partial_finetuning
      training_mode: partial_finetuning
      epochs: 5
      learning_rate_multiplier: 0.1
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 3

outputs:
  run_dir: runs/tuning_resnet18
  checkpoint_dir: checkpoints/tuning_resnet18
